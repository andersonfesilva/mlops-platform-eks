name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: terraform fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: fmt
        run: terraform fmt -check -recursive infra/
      - name: validate modules
        run: |
          for dir in infra/modules/*/; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

  checkov:
    name: checkov (IaC + Kubernetes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          config_file: .checkov.yaml

  trivy-config:
    name: trivy misconfiguration scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          trivyignores: .trivyignore

  kubernetes:
    name: kubeconform + conftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary -ignore-missing-schemas \
            -kubernetes-version 1.31.0 platform/
      - name: conftest verify (policy unit tests)
        run: docker run --rm -v "$PWD:/project" -w /project openpolicyagent/conftest:v0.56.0 verify --policy policies/kubernetes
      - name: conftest test (manifests)
        run: docker run --rm -v "$PWD:/project" -w /project openpolicyagent/conftest:v0.56.0 test --policy policies/kubernetes platform/base/

  rag-api:
    name: rag-api lint + tests + image scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/rag-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/rag-api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: build image
        run: docker build -t rag-api:${{ github.sha }} .
      - name: trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: rag-api:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
