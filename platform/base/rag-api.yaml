apiVersion: v1
kind: ServiceAccount
metadata:
  name: rag-api
  namespace: rag
  annotations:
    # Output of infra/live/dev/irsa-rag-api (role_arn).
    eks.amazonaws.com/role-arn: arn:aws:iam::111111111111:role/mlops-dev-rag-api
# IRSA injects its own projected web-identity token; the Kubernetes API token is not needed.
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-api
  namespace: rag
  labels:
    app.kubernetes.io/name: rag-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rag-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rag-api
    spec:
      serviceAccountName: rag-api
      nodeSelector:
        workload: system
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rag-api
          image: 111111111111.dkr.ecr.us-east-1.amazonaws.com/rag-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: LLM_BASE_URL
              value: http://llm-predictor.inference.svc.cluster.local/openai/v1
            - name: LLM_MODEL
              value: llm
            - name: CORPUS_DIR
              value: /app/data
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: rag-api
  namespace: rag
  labels:
    app.kubernetes.io/name: rag-api
spec:
  selector:
    app.kubernetes.io/name: rag-api
  ports:
    - name: http
      port: 80
      targetPort: http
